<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to DataPlug</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
body{background:#6f2dbd;overflow:hidden}
.hero{width:100%;height:100vh;display:flex;justify-content:center;align-items:center;position:relative;background:linear-gradient(135deg,#5f27cd,#b337ff)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.content{position:relative;z-index:2;text-align:center;color:#fff;max-width:700px;padding:20px}
h1{font-size:55px;margin-bottom:15px}p{font-size:20px;margin-bottom:35px}
.btn{display:inline-block;text-decoration:none;background:#ffb703;color:#111;padding:18px 45px;border-radius:50px;font-weight:600}
.btn:hover{background:#ffd60a}
@media(max-width:768px){h1{font-size:38px}p{font-size:17px}}
</style>
</head>
<body>
<section class="hero">
<img src="2-e1740332826335.webp" alt="Welcome">
<div class="overlay"></div>
<div class="content">
<h1>Welcome to DataPlug</h1>
<p>Fast, Secure & Reliable Data Bundle Delivery Across Ghana.</p>
<a class="btn" href="https://dataplug.up.railway.app/">Get Started</a>
</div>
</section>
</body>
</html>
