<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Loomlyz Serves</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Poppins,sans-serif}
html,body{height:100%}
body{
  min-height:100vh;overflow:hidden;position:relative;
  background:radial-gradient(circle at 15% 20%, #1e63e9 0%, #0b3fb0 45%, #072a7a 100%);
  display:flex;justify-content:center;align-items:center;
}
.glow{
  position:absolute;border-radius:50%;filter:blur(80px);opacity:.55;
}
.glow.one{width:520px;height:520px;background:#3b82f6;top:-160px;left:-140px;}
.glow.two{width:460px;height:460px;background:#60a5fa;bottom:-180px;right:-120px;}
.grid-overlay{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
                    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
}
.content{
  position:relative;z-index:2;text-align:center;color:#fff;max-width:640px;padding:40px 24px;
}
.mark{
  width:76px;height:76px;margin:0 auto 28px;border-radius:20px;
  background:rgba(255,255,255,.1);
  border:1px solid rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 20px 50px rgba(3,15,60,.35);
  animation:pop .6s cubic-bezier(.34,1.56,.64,1) both;
}
.mark svg{width:38px;height:38px}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}
.eyebrow{
  display:inline-block;font-size:13px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,.65);margin-bottom:18px;font-weight:500;
  animation:fade .6s ease .1s both;
}
h1{font-size:52px;font-weight:700;line-height:1.15;margin-bottom:18px;letter-spacing:-.5px;animation:fade .6s ease .2s both}
p{font-size:18px;line-height:1.6;color:rgba(255,255,255,.8);margin-bottom:38px;font-weight:300;animation:fade .6s ease .3s both}
.btn{
  display:inline-flex;align-items:center;gap:10px;text-decoration:none;
  background:#fff;color:#0b3fb0;padding:17px 42px;border-radius:50px;font-weight:600;font-size:16px;
  box-shadow:0 15px 40px rgba(3,15,60,.35);
  transition:transform .2s ease, box-shadow .2s ease;
  animation:fade .6s ease .4s both;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 50px rgba(3,15,60,.45)}
.btn svg{width:16px;height:16px;transition:transform .2s ease}
.btn:hover svg{transform:translateX(3px)}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:768px){h1{font-size:36px}p{font-size:16px}}
</style>
</head>
<body>
<div class="glow one"></div>
<div class="glow two"></div>
<div class="grid-overlay"></div>
<div class="content">
<div class="mark">
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M4 17L10 11L14 15L20 7" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M20 7H14" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M20 7V13" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
</div>
<span class="eyebrow">Loomlyz Serves</span>
<h1>Welcome to Loomlyz Serves</h1>
<p>Fast, Secure &amp; Reliable Data Bundle Delivery Across Ghana.</p>
<a class="btn" href="https://loomlyz.netlify.app/">
Get Started
<svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12H19M19 12L13 6M19 12L13 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
</a>
</div>
</body>
</html>
