<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Payment Hub — Successful Transactions</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #131a24;
    --panel-border: #22303f;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --accent: #d4a340;
    --accent-dim: #a17f34;
    --success: #3fb950;
    --danger: #e5534b;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
  }

  .topbar {
    border-bottom: 1px solid var(--panel-border);
    padding: 20px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  .brand .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--success);
    box-shadow: 0 0 8px var(--success);
  }

  .brand small {
    color: var(--text-dim);
    font-weight: 400;
    font-family: var(--mono);
    font-size: 12px;
    margin-left: 6px;
  }

  main {
    max-width: 1080px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ---- Gate screen ---- */
  #gate {
    max-width: 420px;
    margin: 120px auto 0;
    text-align: center;
  }
  #gate h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  #gate p { color: var(--text-dim); font-size: 14px; margin-bottom: 28px; }

  input, select {
    width: 100%;
    background: #0a0e14;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 11px 13px;
    border-radius: 6px;
    font-size: 14px;
    font-family: var(--mono);
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent-dim); }
  input::placeholder { color: #4a5568; }

  label {
    display: block;
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 6px;
    font-family: var(--sans);
  }

  .field { margin-bottom: 16px; }

  button {
    cursor: pointer;
    border: none;
    border-radius: 6px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    font-family: var(--sans);
    transition: opacity 0.15s;
  }
  button:hover { opacity: 0.88; }
  button:active { opacity: 0.75; }

  .btn-primary { background: var(--accent); color: #1a1305; width: 100%; }
  .btn-secondary { background: transparent; border: 1px solid var(--panel-border); color: var(--text); }
  .btn-danger { background: transparent; border: 1px solid #4a2323; color: var(--danger); }
  .btn-small { padding: 6px 12px; font-size: 12px; }

  #error-msg { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }

  /* ---- Dashboard ---- */
  #dashboard { display: none; }

  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-head h2 { font-size: 16px; font-weight: 600; margin: 0; }
  .section-head .count { color: var(--text-dim); font-size: 13px; font-family: var(--mono); }

  .panel {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 8px 24px;
    margin-bottom: 28px;
  }

  .txn-list { display: flex; flex-direction: column; gap: 1px; }

  .txn-row {
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr auto auto;
    align-items: center;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--panel-border);
  }
  .txn-row:last-child { border-bottom: none; }

  .txn-email { font-weight: 600; font-size: 14px; }
  .txn-meta {
    color: var(--text-dim);
    font-size: 12px;
    font-family: var(--mono);
    margin-top: 3px;
    word-break: break-all;
  }

  .txn-amount { font-family: var(--mono); font-size: 14px; }
  .txn-date { color: var(--text-dim); font-size: 12px; font-family: var(--mono); }

  .badge {
    font-size: 11px;
    font-family: var(--mono);
    padding: 3px 8px;
    border-radius: 20px;
    white-space: nowrap;
    background: rgba(63,185,80,0.12);
    color: var(--success);
    border: 1px solid rgba(63,185,80,0.3);
  }

  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; }

  .search-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .search-row input { max-width: 360px; }
</style>
</head>
<body>

<div id="gate">
  <h1>Payment Hub</h1>
  <p>Enter your admin key to view successful transactions</p>
  <div class="field">
    <input type="password" id="admin-key-input" placeholder="Admin key" autocomplete="off" />
  </div>
  <button class="btn-primary" onclick="unlock()">Unlock</button>
  <div id="error-msg"></div>
</div>

<div id="dashboard">
  <div class="topbar">
    <div class="brand"><span class="dot"></span>Payment Hub <small>Successful Transactions</small></div>
    <button class="btn-secondary btn-small" onclick="lock()">Lock</button>
  </div>

  <main>
    <div class="search-row">
      <input type="text" id="search-input" placeholder="Filter by email, reference, or site..." oninput="renderTransactions()" />
      <button class="btn-secondary btn-small" onclick="loadTransactions()">Refresh</button>
    </div>

    <div class="section-head">
      <h2>Successful transactions</h2>
      <span class="count" id="txn-count">0</span>
    </div>
    <div class="panel">
      <div id="txn-list" class="txn-list"></div>
      <div id="empty-state" class="empty-state" style="display:none;">No successful transactions yet.</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const HUB_URL = window.location.origin;
  let allTransactions = [];

  function getAdminKey() { return sessionStorage.getItem('hub_admin_key'); }

  async function unlock() {
    const key = document.getElementById('admin-key-input').value.trim();
    const errEl = document.getElementById('error-msg');
    errEl.style.display = 'none';
    if (!key) return;

    try {
      const res = await fetch(`${HUB_URL}/admin/transactions/successful`, { headers: { 'x-admin-key': key } });
      if (!res.ok) throw new Error('Invalid admin key');
      sessionStorage.setItem('hub_admin_key', key);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadTransactions();
    } catch (e) {
      errEl.textContent = 'Invalid admin key, or the hub is unreachable.';
      errEl.style.display = 'block';
    }
  }

  function lock() {
    sessionStorage.removeItem('hub_admin_key');
    document.getElementById('dashboard').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
    document.getElementById('admin-key-input').value = '';
  }

  async function loadTransactions() {
    const key = getAdminKey();
    const res = await fetch(`${HUB_URL}/admin/transactions/successful`, { headers: { 'x-admin-key': key } });
    if (!res.ok) { lock(); return; }
    const { data } = await res.json();
    allTransactions = data;
    renderTransactions();
  }

  function renderTransactions() {
    const q = document.getElementById('search-input').value.trim().toLowerCase();
    const filtered = !q
      ? allTransactions
      : allTransactions.filter((t) =>
          [t.email, t.reference, t.merchant && t.merchant.name].filter(Boolean).some((v) => v.toLowerCase().includes(q))
        );

    const list = document.getElementById('txn-list');
    const empty = document.getElementById('empty-state');
    document.getElementById('txn-count').textContent = filtered.length;

    if (filtered.length === 0) {
      list.innerHTML = '';
      empty.style.display = 'block';
      return;
    }
    empty.style.display = 'none';

    list.innerHTML = filtered.map((t) => `
      <div class="txn-row">
        <div>
          <div class="txn-email">${escapeHtml(t.email)}</div>
          <div class="txn-meta">${escapeHtml(t.reference)}</div>
        </div>
        <div class="txn-meta">${escapeHtml(t.merchant ? t.merchant.name : '—')}</div>
        <div class="txn-amount">${escapeHtml(t.currency)} ${Number(t.amount).toFixed(2)}</div>
        <div class="txn-date">${formatDate(t.createdAt)}</div>
        <div style="display:flex; gap:6px; justify-content:flex-end;">
          <span class="badge">success</span>
          <button class="btn-danger btn-small" onclick="deleteTransaction('${t.id}', '${escapeHtml(t.reference).replace(/'/g, "\\'")}')">Delete</button>
        </div>
      </div>
    `).join('');
  }

  async function deleteTransaction(id, reference) {
    if (!confirm(`Delete transaction ${reference}? This permanently removes this successful payment record. This cannot be undone.`)) {
      return;
    }
    try {
      const res = await fetch(`${HUB_URL}/admin/transactions/${id}`, {
        method: 'DELETE',
        headers: { 'x-admin-key': getAdminKey() },
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.message || 'Failed to delete transaction');
      showToast(json.message || 'Deleted');
      loadTransactions();
    } catch (e) {
      showToast(e.message);
    }
  }

  function formatDate(iso) {
    try {
      return new Date(iso).toLocaleString();
    } catch (e) {
      return iso;
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  // Auto-unlock if key already saved this session (shared sessionStorage key with the
  // main admin dashboard — same admin, same key).
  if (getAdminKey()) {
    document.getElementById('admin-key-input').value = getAdminKey();
    unlock();
  }
</script>

</body>
</html>
