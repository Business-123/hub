<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Payment Hub — Ledger</title>
<style>
  :root {
    --bg: #0d1117;
    --paper: #161d29;
    --paper-2: #131a24;
    --panel-border: #22303f;
    --text: #e6edf3;
    --text-dim: #8b98a5;
    --text-faint: #566274;
    --accent: #d4a340;
    --accent-dim: #a17f34;
    --success: #3fb950;
    --success-dim: rgba(63,185,80,0.12);
    --danger: #e5534b;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* ---------- Gate ---------- */
  #gate {
    max-width: 340px;
    margin: 0 auto;
    padding: 100px 24px 0;
    text-align: center;
  }
  #gate .mark {
    width: 40px; height: 40px; border-radius: 10px;
    background: var(--accent); color: #1a1305;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; margin: 0 auto 18px;
  }
  #gate h1 { font-size: 19px; font-weight: 600; margin: 0 0 6px; }
  #gate p { color: var(--text-dim); font-size: 13.5px; margin: 0 0 26px; line-height: 1.5; }
  input {
    width: 100%;
    background: #0a0e14;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 13px 14px;
    border-radius: 8px;
    font-size: 15px;
    font-family: var(--mono);
    outline: none;
  }
  input:focus { border-color: var(--accent-dim); }
  button {
    cursor: pointer; border: none; border-radius: 8px;
    font-family: var(--sans); font-weight: 600; transition: opacity .15s, transform .1s;
  }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--accent); color: #1a1305; width: 100%; padding: 13px; font-size: 15px; margin-top: 12px; }
  #gate-error { color: var(--danger); font-size: 13px; margin-top: 14px; display: none; }

  /* ---------- Shell ---------- */
  #app { display: none; }

  header.top {
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,17,23,0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--panel-border);
    padding: 16px 16px 0;
  }
  .topline {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .topline .title { display: flex; align-items: baseline; gap: 8px; }
  .topline h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .topline .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 6px var(--success); display: inline-block; }
  .icon-btn {
    background: var(--paper-2); border: 1px solid var(--panel-border); color: var(--text-dim);
    width: 34px; height: 34px; border-radius: 8px; font-size: 15px;
    display: flex; align-items: center; justify-content: center;
  }
  a.nav-link { color: var(--text-dim); text-decoration: none; font-size: 12px; font-family: var(--mono); }

  /* Revenue summary strip */
  .summary-strip {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px;
    scrollbar-width: none;
  }
  .summary-strip::-webkit-scrollbar { display: none; }
  .sum-card {
    flex: 0 0 auto;
    background: linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 118px;
  }
  .sum-card .lbl { font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .sum-card .val { font-family: var(--mono); font-size: 16px; font-weight: 600; color: var(--accent); }
  .sum-card .sub { font-size: 10.5px; color: var(--text-dim); margin-top: 2px; font-family: var(--mono); }

  /* Filter chips */
  .chip-row {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px;
    scrollbar-width: none;
  }
  .chip-row::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    padding: 7px 13px;
    border-radius: 20px;
    border: 1px solid var(--panel-border);
    background: var(--paper-2);
    color: var(--text-dim);
    font-size: 12.5px;
    font-family: var(--mono);
    white-space: nowrap;
  }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #1a1305; font-weight: 600; }

  .search-wrap { padding-bottom: 12px; display: none; }
  .search-wrap.show { display: block; }
  .search-wrap input { font-family: var(--sans); font-size: 14px; }

  main { max-width: 520px; margin: 0 auto; padding: 16px; }

  /* ---------- Receipt cards ---------- */
  #feed { display: flex; flex-direction: column; gap: 14px; }

  .receipt {
    background: var(--paper);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    overflow: hidden;
    animation: rise .28s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .r-head {
    padding: 16px 18px 14px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .r-site {
    font-size: 11px; color: var(--text-dim); font-family: var(--mono);
    text-transform: uppercase; letter-spacing: 0.05em;
    display: flex; align-items: center; gap: 6px;
  }
  .r-site .swatch { width: 7px; height: 7px; border-radius: 2px; background: var(--accent-dim); flex-shrink:0; }
  .r-time { font-size: 11px; color: var(--text-faint); font-family: var(--mono); white-space: nowrap; margin-left: 10px; }

  .r-amount-row { padding: 0 18px 14px; display: flex; align-items: center; justify-content: space-between; }
  .r-amount { font-family: var(--mono); font-size: 25px; font-weight: 700; letter-spacing: -0.02em; }
  .r-amount .cur { font-size: 13px; color: var(--text-dim); font-weight: 500; margin-right: 4px; }
  .badge-success {
    font-size: 10.5px; font-family: var(--mono); font-weight: 600;
    padding: 4px 9px; border-radius: 20px;
    background: var(--success-dim); color: var(--success);
    border: 1px solid rgba(63,185,80,0.3);
    text-transform: uppercase; letter-spacing: 0.04em;
  }

  /* the tear-off perforation — signature element */
  .tear {
    height: 14px;
    background-image: radial-gradient(circle at 7px 7px, var(--bg) 6.5px, transparent 7px);
    background-size: 18px 14px;
    background-repeat: repeat-x;
    background-position: -2px 0;
  }

  .r-body { padding: 14px 18px 16px; }
  .r-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; }
  .r-row .k { font-size: 12px; color: var(--text-faint); }
  .r-row .v { font-size: 12.5px; color: var(--text); font-family: var(--mono); text-align: right; max-width: 62%; overflow-wrap: anywhere; }

  .r-toggle {
    width: 100%; background: none; border: none; color: var(--accent-dim);
    font-size: 11.5px; font-family: var(--mono); text-align: left; padding: 8px 0 0;
  }
  .r-meta {
    display: none; margin-top: 8px; padding: 10px 12px;
    background: var(--paper-2); border-radius: 8px; border: 1px dashed var(--panel-border);
  }
  .r-meta.show { display: block; }
  .r-meta .m-row { display: flex; justify-content: space-between; gap: 10px; font-size: 11.5px; padding: 3px 0; font-family: var(--mono); }
  .r-meta .m-row .mk { color: var(--text-faint); }
  .r-meta .m-row .mv { color: var(--text-dim); text-align: right; overflow-wrap: anywhere; }
  .r-meta .m-empty { font-size: 11.5px; color: var(--text-faint); font-style: italic; }

  /* ---------- Load more / states ---------- */
  #load-more-wrap { text-align: center; margin-top: 6px; }
  .btn-outline {
    background: transparent; border: 1px solid var(--panel-border); color: var(--text-dim);
    padding: 11px 20px; font-size: 13px; border-radius: 8px;
  }
  .empty {
    text-align: center; padding: 70px 20px; color: var(--text-dim);
  }
  .empty .big { font-size: 30px; margin-bottom: 10px; }
  .empty p { font-size: 13.5px; line-height: 1.5; margin: 0; }
  .skeleton {
    height: 118px; border-radius: 14px; background: var(--paper);
    border: 1px solid var(--panel-border);
    position: relative; overflow: hidden;
  }
  .skeleton::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.03), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--paper-2); border: 1px solid var(--panel-border); color: var(--text);
    padding: 10px 18px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 100;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="gate">
  <div class="mark">₵</div>
  <h1>Successful payments ledger</h1>
  <p>Enter your admin key to view successful transactions across all registered sites.</p>
  <input type="password" id="admin-key-input" placeholder="Admin key" autocomplete="off" />
  <button class="btn-primary" onclick="unlock()">Unlock</button>
  <div id="gate-error"></div>
</div>

<div id="app">
  <header class="top">
    <div class="topline">
      <div class="title">
        <span class="live-dot"></span>
        <h1>Ledger</h1>
      </div>
      <div style="display:flex; gap:8px; align-items:center;">

        <button class="icon-btn" onclick="toggleSearch()" title="Search">⌕</button>
        <button class="icon-btn" onclick="refreshAll()" title="Refresh">↻</button>
      </div>
    </div>

    <div class="summary-strip" id="summary-strip">
      <div class="skeleton" style="width:118px; height:56px; flex:0 0 auto;"></div>
    </div>

    <div class="chip-row" id="chip-row"></div>

    <div class="search-wrap" id="search-wrap">
      <input type="text" id="search-input" placeholder="Search email or reference..." oninput="debouncedSearch()" />
    </div>
  </header>

  <main>
    <div id="feed">
      <div class="skeleton"></div>
      <div class="skeleton"></div>
      <div class="skeleton"></div>
    </div>
    <div id="load-more-wrap" style="display:none;">
      <button class="btn-outline" onclick="loadMore()" id="load-more-btn">Load more</button>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const HUB_URL = window.location.origin;
  let state = { merchantId: null, q: '', cursor: null, sites: [], loading: false };
  let searchTimer = null;

  function getAdminKey() { return sessionStorage.getItem('hub_admin_key'); }

  async function unlock() {
    const key = document.getElementById('admin-key-input').value.trim();
    const errEl = document.getElementById('gate-error');
    errEl.style.display = 'none';
    if (!key) return;
    try {
      const res = await fetch(`${HUB_URL}/admin/transactions/summary`, { headers: { 'x-admin-key': key } });
      if (!res.ok) throw new Error('Invalid admin key');
      sessionStorage.setItem('hub_admin_key', key);
      document.getElementById('gate').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      boot();
    } catch (e) {
      errEl.textContent = 'Invalid admin key, or the hub is unreachable.';
      errEl.style.display = 'block';
    }
  }

  function lock() {
    sessionStorage.removeItem('hub_admin_key');
    document.getElementById('app').style.display = 'none';
    document.getElementById('gate').style.display = 'block';
  }

  function toggleSearch() {
    document.getElementById('search-wrap').classList.toggle('show');
    document.getElementById('search-input').focus();
  }

  function debouncedSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      state.q = document.getElementById('search-input').value.trim();
      state.cursor = null;
      loadFeed(true);
    }, 350);
  }

  async function boot() {
    await loadSummary();
    await loadFeed(true);
  }

  async function refreshAll() {
    await loadSummary();
    state.cursor = null;
    await loadFeed(true);
    showToast('Refreshed');
  }

  async function loadSummary() {
    const key = getAdminKey();
    const res = await fetch(`${HUB_URL}/admin/transactions/summary`, { headers: { 'x-admin-key': key } });
    if (!res.ok) { lock(); return; }
    const { data } = await res.json();
    state.sites = data.sites;

    const strip = document.getElementById('summary-strip');
    const totalsHtml = (data.totals.length ? data.totals : [{ currency: '—', total: 0 }]).map(t => `
      <div class="sum-card">
        <div class="lbl">${escapeHtml(t.currency)} revenue</div>
        <div class="val">${formatMoney(t.total, t.currency)}</div>
      </div>
    `).join('');
    strip.innerHTML = `
      <div class="sum-card">
        <div class="lbl">Successful</div>
        <div class="val">${data.totalSuccessful}</div>
        <div class="sub">${data.siteCount} site${data.siteCount === 1 ? '' : 's'} registered</div>
      </div>
      ${totalsHtml}
    `;

    // Build filter chips from distinct sites appearing in successful transactions,
    // falling back to nothing if there's no volume yet.
    const seen = new Map();
    data.sites.forEach(s => { if (!seen.has(s.siteId)) seen.set(s.siteId, s.site); });
    const chips = document.getElementById('chip-row');
    let html = `<div class="chip ${state.merchantId ? '' : 'active'}" onclick="filterSite(null)">All sites</div>`;
    seen.forEach((name, id) => {
      html += `<div class="chip ${state.merchantId === id ? 'active' : ''}" onclick="filterSite('${id}')">${escapeHtml(name)}</div>`;
    });
    chips.innerHTML = html;
  }

  function filterSite(id) {
    state.merchantId = id;
    state.cursor = null;
    document.querySelectorAll('#chip-row .chip').forEach(c => c.classList.remove('active'));
    event.target.classList.add('active');
    loadFeed(true);
  }

  async function loadFeed(reset) {
    if (state.loading) return;
    state.loading = true;
    const key = getAdminKey();
    const params = new URLSearchParams({ limit: 20 });
    if (state.merchantId) params.set('merchantId', state.merchantId);
    if (state.q) params.set('q', state.q);
    if (!reset && state.cursor) params.set('cursor', state.cursor);

    const feed = document.getElementById('feed');
    if (reset) feed.innerHTML = `<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>`;

    try {
      const res = await fetch(`${HUB_URL}/admin/transactions?${params.toString()}`, { headers: { 'x-admin-key': key } });
      if (!res.ok) { lock(); return; }
      const { data, nextCursor } = await res.json();
      state.cursor = nextCursor;

      if (reset) feed.innerHTML = '';
      if (reset && data.length === 0) {
        feed.innerHTML = `
          <div class="empty">
            <div class="big">🧾</div>
            <p>No successful payments yet${state.merchantId ? ' for this site' : ' across your registered sites'}.<br>They'll show up here the moment Paystack confirms one.</p>
          </div>`;
        document.getElementById('load-more-wrap').style.display = 'none';
        state.loading = false;
        return;
      }

      feed.insertAdjacentHTML('beforeend', data.map(renderReceipt).join(''));
      document.getElementById('load-more-wrap').style.display = nextCursor ? 'block' : 'none';
    } catch (e) {
      showToast('Could not load transactions');
    }
    state.loading = false;
  }

  function loadMore() { loadFeed(false); }

  function renderReceipt(t) {
    const metaEntries = t.metadata && typeof t.metadata === 'object' ? Object.entries(t.metadata) : [];
    const metaId = 'meta-' + t.id;
    const metaHtml = metaEntries.length
      ? metaEntries.map(([k, v]) => `<div class="m-row"><span class="mk">${escapeHtml(k)}</span><span class="mv">${escapeHtml(String(v))}</span></div>`).join('')
      : `<div class="m-empty">No extra metadata attached to this order.</div>`;

    return `
      <div class="receipt">
        <div class="r-head">
          <div class="r-site"><span class="swatch"></span>${escapeHtml(t.site.name)}</div>
          <div class="r-time" title="${new Date(t.createdAt).toLocaleString()}">${relativeTime(t.createdAt)}</div>
        </div>
        <div class="r-amount-row">
          <div class="r-amount"><span class="cur">${escapeHtml(t.currency)}</span>${formatMoney(t.amount, t.currency, true)}</div>
          <span class="badge-success">Success</span>
        </div>
        <div class="tear"></div>
        <div class="r-body">
          <div class="r-row"><span class="k">Customer</span><span class="v">${escapeHtml(t.email)}</span></div>
          <div class="r-row"><span class="k">Reference</span><span class="v">${escapeHtml(t.reference)}</span></div>
          <button class="r-toggle" onclick="toggleMeta('${metaId}')">Order details ▾</button>
          <div class="r-meta" id="${metaId}">${metaHtml}</div>
        </div>
      </div>
    `;
  }

  function toggleMeta(id) {
    document.getElementById(id).classList.toggle('show');
  }

  function formatMoney(n, currency, bare) {
    try {
      const formatted = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(n);
      return formatted;
    } catch (e) {
      return Number(n).toFixed(2);
    }
  }

  function relativeTime(iso) {
    const diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 60) return 'just now';
    if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
    if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
    if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
    return new Date(iso).toLocaleDateString();
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str === undefined || str === null ? '' : str;
    return div.innerHTML;
  }

  if (getAdminKey()) {
    document.getElementById('admin-key-input').value = getAdminKey();
    unlock();
  }
</script>

</body>
</html>
